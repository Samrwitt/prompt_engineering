[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-metaheuristics"
version = "1.1.0"
description = "Joint instruction and few-shot prompt optimization with nature-inspired metaheuristics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Prompt Optimization Team"}]
dependencies = [
  "numpy",
  "tqdm",
  "scipy",
  "pandas",
  "requests",
  "matplotlib",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dashboard = ["streamlit>=1.32"]
llm = ["dspy-ai"]

[project.scripts]
promptopt = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
